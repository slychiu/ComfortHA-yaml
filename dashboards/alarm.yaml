views:
- title: Home
  sections:
  - type: grid
    cards:
    - type: heading
      heading_style: title
    - type: vertical-stack
      cards:
      - type: markdown
        title: Alarm Status
        content: "{% set status = states('alarm_control_panel.comfort_alarm') %} {% if status == 'disarmed' %}\n  System is currently: **System Disarmed**\n{% elif status == 'armed_home' %}\n  System is currently: **System Armed (Home)**\n{% elif status == 'armed_away' %}\n  System is currently: **System Armed (Away)**\n{% elif status == 'armed_night' %}\n  System is currently: **System Armed (Night)**\n{% else %}\n  System is currently: **{{ status | replace('_', ' ') | title }}**\n{% endif %}"
      - type: conditional
        conditions:
        - condition: state
          entity: alarm_control_panel.comfort_alarm
          state: disarmed
        card:
          type: grid
          columns: 3
          square: false
          cards:
          - type: button
            name: Away
            icon: mdi:shield-lock
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.comfort_arm_away
          - type: button
            name: Night
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.comfort_arm_night
          - type: button
            name: Day
            icon: mdi:home-lock
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.comfort_arm_home
    - type: grid
      title: Keypad
      columns: 3
      square: false
      cards:
      - show_name: true
        show_icon: true
        type: button
        name: '1'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '1'
      - type: button
        name: '2'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '2'
      - type: button
        name: '3'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '3'
      - type: button
        name: '4'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '4'
      - type: button
        name: '5'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '5'
      - type: button
        name: '6'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '6'
      - type: button
        name: '7'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '7'
      - type: button
        name: '8'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '8'
      - type: button
        name: '9'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '9'
      - type: button
        icon: mdi:asterisk
        show_name: false
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_clear
      - type: button
        name: '0'
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_append
          data:
            variables:
              key: '0'
      - type: button
        icon: mdi:pound
        show_name: false
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.comfort_pin_submit
      card_mod:
        style: "ha-card {\n  --grid-card-gap: 6px;\n}\n/* Force row height */\n#root {\n  grid-auto-rows: 60px !important;\n}\n"
    - type: markdown
      title: Comfort Message
      content: '{{ states(''input_text.comfort_alarm_message'') }}'
    - !include includes/alarm_status_button.yaml
    
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: custom:auto-entities
        card:
          type: grid
          title: Zones
          columns: 4
          square: false
        card_param: cards
        filter:
          include:
          - entity_id: binary_sensor.cytech_comfort_mqtt_input*
            options:
              type: custom:button-card
              show_state: true
              show_icon: true
              triggers_update: all
              variables:
                zone_bypassed: "[[[ const n = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); const s = n && hass.states['sensor.' + n + '_bypass_status']; return !!s && (s.state || '').toLowerCase() === 'bypassed'; ]]]"
                bypass_color: "[[[ return (hass.themes && hass.themes.darkMode) ? '#ffb74d' : '#e65100'; ]]]"
              state_display: "[[[\n  const bfn = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');\n  const bst = hass.states['sensor.' + bfn + '_bypass_status'];\n  if (bst && (bst.state || '').toLowerCase() === 'bypassed') return 'Bypassed';\n  const name = (entity.attributes.friendly_name || '').toLowerCase();\n  if (name.includes('light')) return entity.state === 'on' ? 'On' : 'Off';\n  if (name.includes('tamper')) return entity.state === 'on' ? 'Tampered' : 'Secure';\n  if (name.includes('panic')) return entity.state === 'on' ? 'PANIC' : 'Normal';\n  if (name.includes('fire') || name.includes('smoke')) return entity.state === 'on' ? 'ALERT' : 'Normal';\n  return entity.state === 'on' ? 'Open' : 'Closed';\n]]]\n"
              icon: "[[[\n  const isOff = entity.state === 'off';\n  const name = (entity.attributes.friendly_name || '').toLowerCase();\n  if (name.includes('light')) return isOff ? 'mdi:lightbulb-off' : 'mdi:lightbulb';\n  if (name.includes('door')) return isOff ? 'mdi:door-closed' : 'mdi:door-open';\n  if (name.includes('window')) return isOff ? 'mdi:window-closed' : 'mdi:window-open';\n  if (name.includes('gate')) return isOff ? 'mdi:gate' : 'mdi:gate-open';\n  if (name.includes('pir') || name.includes('motion')) return isOff ? 'mdi:motion-sensor-off' : 'mdi:motion-sensor';\n  if (name.includes('tamper')) return isOff ? 'mdi:lock' : 'mdi:lock-open-alert';\n  if (name.includes('fire') || name.includes('smoke')) return isOff ? 'mdi:smoke-detector-off' : 'mdi:fire-alert';\n  if (name.includes('panic')) return isOff ? 'mdi:alarm-light-off' : 'mdi:alarm-light';\n  return isOff ? 'mdi:shield-check' : 'mdi:shield-alert';\n]]]\n"
              name: "[[[\n  let n = entity?.attributes?.friendly_name || entity?.entity_id || 'Zone';\n  n = n.replace(/^Comfort\\s*/i, '');\n  return n.replace(/([a-z])([A-Z])/g, '$1 $2');\n]]]\n"
              hold_action:
                action: call-service
                service: button.press
                service_data:
                  entity_id: "[[[ const n = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); return n ? ('button.' + n + (variables.zone_bypassed ? '_clear_bypass' : '_set_bypass')) : ''; ]]]"
              state:
              - value: 'on'
                styles:
                  card:
                  - border: "[[[ return variables.zone_bypassed ? '2px dashed ' + variables.bypass_color : '4px solid var(--warning-color)'; ]]]"
                  icon:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  name:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  - font-weight: bold
                  - font-size: 11px
                  state:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  - font-size: 10px
              - value: 'off'
                styles:
                  card:
                  - border: "[[[ return variables.zone_bypassed ? '2px dashed ' + variables.bypass_color : '1px solid var(--divider-color)'; ]]]"
                  icon:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'green'; ]]]"
                  name:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'inherit'; ]]]"
                  - font-size: 11px
                  state:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'inherit'; ]]]"
                  - font-size: 10px
          - entity_id: binary_sensor.comfort_*
            options:
              type: custom:button-card
              show_state: true
              show_icon: true
              triggers_update: all
              variables:
                zone_bypassed: "[[[ const n = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); const s = n && hass.states['sensor.' + n + '_bypass_status']; return !!s && (s.state || '').toLowerCase() === 'bypassed'; ]]]"
                bypass_color: "[[[ return (hass.themes && hass.themes.darkMode) ? '#ffb74d' : '#e65100'; ]]]"
              state_display: "[[[\n  const bfn = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');\n  const bst = hass.states['sensor.' + bfn + '_bypass_status'];\n  if (bst && (bst.state || '').toLowerCase() === 'bypassed') return 'Bypassed';\n  const name = (entity.attributes.friendly_name || '').toLowerCase();\n  if (name.includes('light')) return entity.state === 'on' ? 'On' : 'Off';\n  if (name.includes('tamper')) return entity.state === 'on' ? 'Tampered' : 'Secure';\n  if (name.includes('panic')) return entity.state === 'on' ? 'PANIC' : 'Normal';\n  if (name.includes('fire') || name.includes('smoke')) return entity.state === 'on' ? 'ALERT' : 'Normal';\n  return entity.state === 'on' ? 'Open' : 'Closed';\n]]]\n"
              icon: "[[[\n  const isOff = entity.state === 'off';\n  const name = (entity.attributes.friendly_name || '').toLowerCase();\n  if (name.includes('light')) return isOff ? 'mdi:lightbulb-off' : 'mdi:lightbulb';\n  if (name.includes('door')) return isOff ? 'mdi:door-closed' : 'mdi:door-open';\n  if (name.includes('window')) return isOff ? 'mdi:window-closed' : 'mdi:window-open';\n  if (name.includes('gate')) return isOff ? 'mdi:gate' : 'mdi:gate-open';\n  if (name.includes('pir') || name.includes('motion')) return isOff ? 'mdi:motion-sensor-off' : 'mdi:motion-sensor';\n  if (name.includes('tamper')) return isOff ? 'mdi:lock' : 'mdi:lock-open-alert';\n  if (name.includes('fire') || name.includes('smoke')) return isOff ? 'mdi:smoke-detector-off' : 'mdi:fire-alert';\n  if (name.includes('panic')) return isOff ? 'mdi:alarm-light-off' : 'mdi:alarm-light';\n  return isOff ? 'mdi:shield-check' : 'mdi:shield-alert';\n]]]\n"
              name: "[[[\n  let n = entity?.attributes?.friendly_name || entity?.entity_id || 'Zone';\n  n = n.replace(/^Comfort\\s*/i, '');\n  return n.replace(/([a-z])([A-Z])/g, '$1 $2');\n]]]\n"
              hold_action:
                action: call-service
                service: button.press
                service_data:
                  entity_id: "[[[ const n = (entity.attributes.friendly_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); return n ? ('button.' + n + (variables.zone_bypassed ? '_clear_bypass' : '_set_bypass')) : ''; ]]]"
              state:
              - value: 'on'
                styles:
                  card:
                  - border: "[[[ return variables.zone_bypassed ? '2px dashed ' + variables.bypass_color : '4px solid var(--warning-color)'; ]]]"
                  icon:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  name:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  - font-weight: bold
                  - font-size: 11px
                  state:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'red'; ]]]"
                  - font-size: 10px
              - value: 'off'
                styles:
                  card:
                  - border: "[[[ return variables.zone_bypassed ? '2px dashed ' + variables.bypass_color : '1px solid var(--divider-color)'; ]]]"
                  icon:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'green'; ]]]"
                  name:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'inherit'; ]]]"
                  - font-size: 11px
                  state:
                  - color: "[[[ return variables.zone_bypassed ? variables.bypass_color : 'inherit'; ]]]"
                  - font-size: 10px
          exclude:
          - name: Zone*
          - name: Comfort Zone*
          - name: ComfortZone*
          - entity_id: binary_sensor.comfort_connected
          - entity_id: binary_sensor.comfort_bypass_required
    - type: vertical-stack
      cards:
      - type: grid
        columns: 2
        square: false
        card_mod:
          style: |
            #root {
              grid-template-columns: 48px 48px !important;
              gap: 8px !important;
              justify-content: start;
            }
        cards:
        - show_name: true
          show_icon: true
          type: button
          icon: mdi:broom
          name: Clear
          tap_action:
            action: call-service
            service: input_button.press
            data:
              entity_id: input_button.clear_alarm_log
          card_mod:
            style: |
              ha-card {
                width: 48px;
                height: 48px;
                padding: 4px;
              }
        - show_name: true
          show_icon: true
          show_state: true
          type: button
          entity: input_boolean.alarm_log_latest_first
          icon: mdi:sort-clock-descending
          name: Latest first
          tap_action:
            action: toggle
          card_mod:
            style: |
              ha-card {
                width: 48px;
                height: 48px;
                padding: 4px;
              }
      - type: markdown
        title: Alarm Message Log
        content: |-
          {%- set log = state_attr('sensor.comfort_mqtt_log', 'log') or '' -%}
          {%- if is_state('input_boolean.alarm_log_latest_first', 'on') -%}
          {{ log.split('\n') | reverse | join('\n') }}
          {%- else -%}
          {{ log }}
          {%- endif -%}
        card_mod:
          style: |
            ha-card {
              height: 320px;
              overflow: hidden;
            }

            ha-markdown {
              height: 240px;
              overflow-y: auto;
              overflow-x: hidden;
            }
    - type: heading
      heading_style: title
      heading: Log
  - type: grid
    cards:
    - type: heading
      heading_style: title
- !include includes/alarm_status_view.yaml