# v22: adds the Remote Support Access toggle (input_boolean/timer/automations
# below) and its two shell_command entries -- see enable_remote_support.sh /
# disable_remote_support.sh and ensure_ssh_admin_access() in first_boot.sh.
# v25: comment-only bump so cytech_update.sh's auto-restart trigger fires on
# already-deployed devices -- the actual fix this release ships lives only in
# first_boot.sh's apply_usb_host_mode_fix() (see that function for detail).
# v27: adds cytech_check_hdmi shell_command + sensor for the pre-ship
# automatic test harness's HDMI-monitor-detected-at-boot check.
# v28: adds cytech_check_usb shell_command + sensor for the pre-ship
# automatic test harness's USB-storage-detected-at-boot check. Unlike the
# HDMI check, the harness treats a missing USB device here as a real test
# failure (see cytech_check_usb.sh for why).
# v29: cytech_hdmi_result/cytech_usb_result scan_interval 30s -> 5s. Both
# scripts write their result file in under a second, but at 30s the
# command_line sensor's own refresh cadence meant the pre-ship harness could
# see no fresh result for up to ~2x scan_interval (worst case ~60s) after a
# fresh onboarding, since a newly-set-up command_line sensor's first scan
# doesn't necessarily land right away -- live-hit this exact worst case
# 2026-07-29 (harness's 60s timeout expired 1s before the sensor updated).
# v34: combined release (the originally-planned v34/v35 were merged before
# the first push -- no device has ever seen anything between v33 and this).
# Ships three things: ensure_responses_card() in first_boot.sh (one-time ADD
# of a Responses card with native button cards for the bridge addon's
# button.comfort_* response entities; see that function for detail and the
# v34 changelog for why this replaces the custom-card tap_action variants);
# the mqtt sensor below ("Comfort System Status"), the data source for the
# System Status card in dashboards/alarm.yaml -- it shadows nothing,
# unique_id comfort_system_status exists only here, so the update is exactly
# one new sensor on every device (packages lists append to the golden-image
# configuration.yaml's mqtt:sensor list); and the alarm value_template fix
# via ensure_comfort_alarm_template() in first_boot.sh (see that function
# and the manifest changelog for detail). Content changes (not just a
# comment bump) also trip cytech_update.sh's auto-restart trigger.
# v35: SD-card trouble detection + email alerting (see cytech_check_sdcard.sh
# and cytech_canary.sh for the scripts; first_boot.sh's record_boot_event /
# check_boot_storm / ensure_email_secrets for the boot-side pieces). Adds:
# the two shell_commands below, the three command_line sensors whose state is
# the result status (OK/FAIL/SKIP for the card checks, OK/REPEATED_RESTARTS
# for boots -- renamed in v42e from RESTART_STORM so the row says plain
# English; the old "storm"/"restart loop" wording read as jargon) with the
# human-readable detail in their "message" attribute, the input_select
# choosing where alerts go (Cytech support, the device owner,
# or both -- two smtp-notify entries cover Cytech/Me independently), and the
# automations: run both checks on HA start, then email + persistent
# notification the moment any of the three result sensors turns FAIL or
# REPEATED_RESTARTS. Email credentials are never in this repo, and v36 does NOT
# reference them as !secret either: the two smtp notify platforms are a
# device-local packages/cytech_email.yaml generated by ensure_email_secrets()
# from /config/.cytech_secrets (see the bottom of this file for the note).
# v35's raw !secret refs deadlocked every device without creds in recovery
# mode -- the config failed to parse, so the pass that would have written
# the secrets could never run.
# v37: alert emails identify the reporting unit (subject + body prefixed with
# the fleet-unique id from /config/device_id.txt via sensor.cytech_device_id),
# and the unit's OWNER registers their alert email from Config Files ->
# System Health ("Register with Cytech"): the address is stored as
# CY_SMTP_RECIPIENT in the device's .cytech_secrets and a registration notice
# emails support@cytech.biz, so Cytech knows which unit belongs to which
# alert address and can contact the owner when an alert fires. See
# cytech_register_email.sh; the smtp package itself stays generated by
# cytech_email_gen.py (called by ensure_email_secrets in first_boot.sh).
# v40: owner-facing registration UI/flow fixes (see the manifest changelog).
# The field is renamed "My Email" (the address is the OWNER's, not Cytech's);
# a Register press with an empty field is an explicit "enter your email
# first" status instead of a silent rejection; a successful register mails
# the owner (To) with Cytech on copy (Cc) -- the owner's confirmation and
# Cytech's registration notice are the SAME letter; and every press shows a
# screen popup via the .cytech_register_popup file + automation below (same
# one-time-popup pattern as .cytech_notify_pending), in addition to the
# inline result line. sensor.cytech_email_configured gates the dashboard's
# "not registered yet" hint so units without SMTP creds never nag the owner
# to do something they can't.
# v41: the Cytech/Me/Both alert destination switch (input_select
# cytech_alert_destination, v35-era) is REMOVED -- it only ever controlled
# SD alerts, and the owner's copy is now automatic: every alert always goes
# to support@cytech.biz, and the owner's address is added only when
# registered (sensor.cytech_owner_email, read from /config/.cytech_registered).
# The owner's field is renamed "My Email for Alerts" (bare "My Email" read as
# if it were the system's own address).
shell_command:
  cytech_check_only: "nohup bash /config/cytech_check_only.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_check_update: "nohup bash /config/cytech_update.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_reject_update: "nohup bash /config/cytech_reject_update.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_clear_notify: "rm -f /config/.cytech_notify_pending"
  # v40: clears the one-time register popup after the automation below has
  # shown it (same pattern as cytech_clear_notify).
  cytech_clear_register_popup: "rm -f /config/.cytech_register_popup"
  # v42: runtime integrity companion to first_boot.sh's boot-time check.
  # Forked so the script survives long enough to (a) not hold the automation
  # slot and (b) finish its core-restart curl after it has restored a corrupt
  # configuration.yaml. Script: cytech_integrity_check.py in /config.
  cytech_integrity_check: "nohup python3 /config/cytech_integrity_check.py >> /config/cytech_integrity_check.log 2>&1 &"
  # The reset watcher runs as an init_command inside the SSH addon's own
  # container, which now stays up permanently (see ensure_ssh_admin_access
  # in first_boot.sh) instead of being started/stopped around each reset --
  # so the button just needs to drop the trigger file; the watcher is
  # already there to pick it up within 5 seconds. Historically (through
  # 2026-07-04) this had to explicitly start the addon and inject a
  # throwaway credential first, since the addon used to be off in its
  # normal steady state and its own init-ssh script hard-exits if it has no
  # credential at all -- both of those problems went away once the addon
  # stopped turning off in the first place.
  dev_reset: "touch /config/.reset_requested"
  enable_remote_support: "nohup bash /config/enable_remote_support.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  disable_remote_support: "nohup bash /config/disable_remote_support.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_check_hdmi: "nohup bash /config/cytech_check_hdmi.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_check_usb: "nohup bash /config/cytech_check_usb.sh </dev/null >> /config/cytech_update.log 2>&1 &"
  cytech_check_sdcard: "nohup bash /config/cytech_check_sdcard.sh </dev/null >> /config/cytech_sd.log 2>&1 &"
  cytech_canary: "nohup bash /config/cytech_canary.sh </dev/null >> /config/cytech_sd.log 2>&1 &"
  # v37: receives the email via service-call data (shell_command argument
  # substitution), passed along by the cytech_register_email automation.
  cytech_register_email: "nohup bash /config/cytech_register_email.sh '{{ email }}' </dev/null >> /config/cytech_update.log 2>&1 &"

input_boolean:
  remote_support_access:
    name: "Remote Support Access"
    icon: mdi:account-key

input_text:
  automatic_test_result:
    name: "Automatic Test Result"
    max: 255
    icon: mdi:clipboard-check-outline
  cytech_alert_recipient:
    name: "My Email for Alerts"
    max: 255
    icon: mdi:email-edit-outline

# v37: "Register with Cytech" is a template button so its press action can be
# the register script with the CURRENT value of the input_text above -- a
# plain automation.trigger path is out here: this HA release requires the
# triggers key (a trigger-less automation is disabled at config validation),
# and a dashboard button's tap_action data is static and cannot template the
# typed address.
template:
  - button:
      name: "Cytech Register Email"
      unique_id: cytech_register_email_button
      icon: mdi:account-sync-outline
      press:
        - service: shell_command.cytech_register_email
          data:
            email: "{{ states('input_text.cytech_alert_recipient') | trim }}"

timer:
  remote_support_access:
    name: "Remote Support Access"
    duration: "01:00:00"

command_line:
  - sensor:
      name: "Cytech HDMI Result"
      unique_id: cytech_hdmi_result_sensor
      command: "cat /config/.cytech_hdmi_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 5
  - sensor:
      name: "Cytech USB Result"
      unique_id: cytech_usb_result_sensor
      command: "cat /config/.cytech_usb_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 5
  - sensor:
      name: "Cytech Version"
      unique_id: cytech_version_sensor
      command: "cat /config/.cytech_version 2>/dev/null || echo unknown"
      scan_interval: 60
  - sensor:
      # State is just the write timestamp (so the sensor reliably updates
      # even when the message text is unchanged); the actual text lives in
      # the "message" attribute, not the state. Sensor states are capped at
      # 255 characters in HA -- anything longer silently becomes "unknown",
      # which is exactly what broke this once warning text got appended.
      # Attributes have no such limit.
      name: "Cytech Notify Pending"
      unique_id: cytech_notify_pending_sensor
      command: "cat /config/.cytech_notify_pending 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      # Same content as Cytech Notify Pending, but that file gets deleted by
      # the automation below right after showing its one-time popup -- this
      # one is written at the same time but only cleared when the update is
      # actually applied or skipped, so the Config Files dashboard has
      # something stable to read while a decision is still pending.
      name: "Cytech Pending Message"
      unique_id: cytech_pending_message_sensor
      command: "cat /config/.cytech_pending_message 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      name: "Cytech Update Pending"
      unique_id: cytech_update_pending_sensor
      command: "cat /config/.cytech_update_pending 2>/dev/null || echo ''"
      scan_interval: 30
  - sensor:
      name: "Cytech Last Result"
      unique_id: cytech_last_result_sensor
      command: "cat /config/.cytech_last_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      # Written by check_config_integrity in first_boot.sh's maintenance pass
      # (every boot) OR by cytech_integrity_check.py (every 4 h while
      # running, v42) when configuration.yaml or any .storage/* file fails to
      # parse -- the same failure signature both 2026 SD card corruption
      # incidents produced. Deliberately a separate file/sensor from
      # cytech_notify_pending/cytech_last_result: those are update-flow
      # specific, and an integrity alert firing during a pending update would
      # otherwise clobber the update notification text.
      name: "Cytech Integrity Alert"
      unique_id: cytech_integrity_alert_sensor
      command: "cat /config/.cytech_integrity_alert 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      # v42: last result of the runtime config check (written on every cycle
      # by cytech_integrity_check.py): ok / restored / error / missing /
      # restart_failed. Distinguishes "restored" (recovered + restart fired)
      # from a still-active problem on the System Health dashboard.
      # v42a: NAME is "Cytech Integrity Status" so that a FRESH registration
      # gets entity_id sensor.cytech_integrity_status -- HA derives entity_id
      # from the NAME slug, not from unique_id, and v42's name ("Cytech Config
      # Check") generated sensor.cytech_config_check, leaving the dashboard
      # row "Entity not found" (the v36 lesson, caught twice by the user's
      # screenshot).
      # v42b: but the entity_id is PINNED by the entity registry the moment a
      # unique_id is first seen. v42 registered cytech_integrity_status_sensor
      # as sensor.cytech_config_check, and renaming the name: in v42a does NOT
      # move a registered entity_id -- so v42a units that had run v42 still
      # showed "Entity not found" ("not found again" screenshot). The unique_id
      # is therefore CHANGED to cytech_integrity_check_status_sensor: a new
      # unique_id = a fresh registration = entity_id from the current name
      # slug. Renaming back to some previously-registered id is a per-unit
      # history hack -- bump the unique_id instead so every unit converges on
      # the same id. (The now-orphaned sensor.cytech_config_check registry
      # entry on units that ran v42 is unreferenced and harmless.)
      name: "Cytech Integrity Status"
      unique_id: cytech_integrity_check_status_sensor
      # v42c: "waiting" (not "unknown") before the first run ever -- HA's own
      # "unknown" reads like an error on the dashboard; a brand-new unit shows
      # "waiting" for the few seconds until the start-triggered check writes
      # the status file.
      command: "cat /config/.cytech_integrity_status 2>/dev/null || echo waiting"
      scan_interval: 300
  - sensor:
      # v35: SD-card health results. State is the status word (OK / FAIL /
      # SKIP), detail lives in the "message" attribute -- short enough that
      # the 255-char state cap never bites. The FAIL / REPEATED_RESTARTS
      # states
      # feed the alert automations below. Files are written on every HA start
      # by cytech_start_health_checks.
      name: "Cytech SD Card Status"
      unique_id: cytech_sdcard_result_sensor
      command: "cat /config/.cytech_sdcard_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.status | default('') }}"
      json_attributes:
        - message
      scan_interval: 60
  - sensor:
      name: "Cytech SD Canary"
      unique_id: cytech_canary_result_sensor
      command: "cat /config/.cytech_canary_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.status | default('') }}"
      json_attributes:
        - message
      scan_interval: 60
  - sensor:
      # v42f: renamed from 'Cytech Boot Status' -- this row will carry other
      # warnings in the future, not just boot/restart ones. The unique_id is
      # bumped (cytech_warning_result_sensor) on purpose: the entity registry
      # PINNED sensor.cytech_boot_status at first registration, so a rename
      # alone would keep the old id while the name changed; a bumped
      # unique_id re-registers every unit fresh as sensor.cytech_warning
      # (see the v42b note on the Config Check row for the full story). The
      # on-disk result file stays /config/.cytech_boot_result (internal).
      name: "Cytech Warning"
      unique_id: cytech_warning_result_sensor
      command: "cat /config/.cytech_boot_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.status | default('') }}"
      json_attributes:
        - message
      scan_interval: 60
  - sensor:
      # v37: fleet-unique unit identifier -- first_boot.sh derives it from the
      # Tailscale hostname (e.g. cytech-34, cytechoffice-2) and writes it to
      # /config/device_id.txt, so it exists on every provisioned device.
      # Alert emails prefix their subject and body with this id so alerts can
      # be attributed to a specific system without looking anything up. HA
      # location_name cannot be used for this (it stays "Home" unless the
      # owner customizes it).
      name: "Cytech Device ID"
      unique_id: cytech_device_id_sensor
      command: "cat /config/device_id.txt 2>/dev/null | tr -d '\n'"
      scan_interval: 600
  - sensor:
      # v37: last owner-email registration result. State is the write
      # timestamp (so the sensor reliably updates); the human text lives in
      # the "message" attribute, same shape as the other result sensors.
      name: "Cytech Register Result"
      unique_id: cytech_register_result_sensor
      command: "cat /config/.cytech_register_result 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      # v40: ONE-TIME popup source for register results. Same content as the
      # register result above, but this file is deleted by the popup
      # automation right after it fires -- so a reboot never replays a stale
      # popup (the register result file itself intentionally persists for the
      # inline dashboard line).
      name: "Cytech Register Popup"
      unique_id: cytech_register_popup_sensor
      command: "cat /config/.cytech_register_popup 2>/dev/null || echo '{}'"
      value_template: "{{ value_json.ts | default('') }}"
      json_attributes:
        - message
      scan_interval: 30
  - sensor:
      # v40: whether this unit's mail account is installed (installer step).
      # Gates the dashboard's "not registered yet" hint so the owner is only
      # asked to register where registering can actually work.
      name: "Cytech Email Configured"
      unique_id: cytech_email_configured_sensor
      command: "grep -q '^CY_SMTP_PASS=' /config/.cytech_secrets 2>/dev/null && echo yes || echo no"
      scan_interval: 600
  - sensor:
      # v41: the owner's registered alert address (empty when never
      # registered). Gates the automatic owner copy of every alert -- there
      # is no user-facing destination switch anymore: alerts ALWAYS go to
      # support@cytech.biz, and the owner's address is included only when one
      # has been registered.
      name: "Cytech Owner Email"
      unique_id: cytech_owner_email_sensor
      command: "cat /config/.cytech_registered 2>/dev/null | tr -d '\n'"
      scan_interval: 600

automation:
  # v42: runtime config health check. The boot-time check in first_boot.sh
  # only runs at OS boot; this one runs while the system is up (every 4 h)
  # so a corruption happening mid-session is repaired the same day -- and
  # importantly BEFORE the next core restart (e.g. an update) would have
  # landed in HA recovery mode. The script writes .cytech_integrity_alert
  # when there is a problem, deleted on its next clean pass.
  - id: cytech_check_config_health
    alias: "Cytech: Check configuration health"
    mode: single
    trigger:
      # v42c: run right after every core start (boot AND update restarts), so
      # the System Health row never sits on "waiting"/unknown until the first
      # 4-hour tick -- on a unit that just pressed Update Now, a mid-session
      # corruption is repaired minutes after start, not hours later.
      - platform: homeassistant
        event: start
      - platform: time_pattern
        hours: 4
    action:
      - service: shell_command.cytech_integrity_check

  - id: cytech_show_integrity_alert
    alias: "Cytech: Show data integrity alert"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_integrity_alert
    condition:
      - condition: template
        value_template: "{{ states('sensor.cytech_integrity_alert') not in ['', 'unknown', 'unavailable'] }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Cytech: data integrity issue detected"
          message: "{{ state_attr('sensor.cytech_integrity_alert', 'message') }}"
          notification_id: cytech_integrity_alert
      - variables:
          unit: "{{ states('sensor.cytech_device_id') | default('this system') }}"
          msg: "{{ state_attr('sensor.cytech_integrity_alert', 'message') | default('data integrity issue, see dashboard') }}"
      # v42: integrity alerts are now emailed too -- support always, plus the
      # owner's registered address (v41 pattern: no destination switch, the
      # owner copy happens automatically when one is registered).
      - service: notify.cytech_alert_support
        data:
          title: "Cytech data integrity alert: {{ unit }}"
          message: "{{ unit }}: {{ msg }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.cytech_owner_email') not in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - service: notify.cytech_alert_email
                data:
                  title: "Cytech data integrity alert: {{ unit }}"
                  message: "{{ unit }}: {{ msg }}"

  - id: cytech_show_notification
    alias: "Cytech: Show update notification"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_notify_pending
    condition:
      - condition: template
        value_template: "{{ states('sensor.cytech_notify_pending') not in ['', 'unknown', 'unavailable'] }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Cytech configuration update"
          message: "{{ state_attr('sensor.cytech_notify_pending', 'message') }}"
          notification_id: cytech_config_update
      - service: shell_command.cytech_clear_notify

  - id: cytech_show_register_result
    alias: "Cytech: Show register result"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_register_popup
    condition:
      - condition: template
        value_template: "{{ states('sensor.cytech_register_popup') not in ['', 'unknown', 'unavailable'] }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Cytech alert email"
          message: "{{ state_attr('sensor.cytech_register_popup', 'message') }}"
          notification_id: cytech_register_result
      - service: shell_command.cytech_clear_register_popup

  - id: cytech_remote_support_enabled
    alias: "Cytech: Remote support access enabled"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.remote_support_access
        to: "on"
    action:
      - service: shell_command.enable_remote_support
      - service: timer.start
        target:
          entity_id: timer.remote_support_access

  - id: cytech_remote_support_disabled
    alias: "Cytech: Remote support access disabled"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.remote_support_access
        to: "off"
    action:
      - service: shell_command.disable_remote_support
      - service: timer.cancel
        target:
          entity_id: timer.remote_support_access

  - id: cytech_remote_support_timer_expired
    alias: "Cytech: Remote support access timer expired"
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.remote_support_access
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.remote_support_access

  - id: cytech_start_health_checks
    alias: "Cytech: Run SD health checks on start"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      # Each script fails cleanly to SKIP if the SSH addon isn't up yet or
      # needed tools are missing, so this never blocks startup.
      - service: shell_command.cytech_check_sdcard
      - service: shell_command.cytech_canary

  - id: cytech_alert_sdcard_failed
    alias: "Cytech: SD card alert"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_sd_card_status
        to: "FAIL"
    action:
      - service: persistent_notification.create
        data:
          notification_id: cytech_sd_alert
          title: "SD card problem detected"
          message: "{{ state_attr('sensor.cytech_sd_card_status', 'message') | default('see sensor') }}"
      - variables:
          unit: "{{ states('sensor.cytech_device_id') }}"
          msg: "{{ state_attr('sensor.cytech_sd_card_status', 'message') | default('see sensor') }}"
      - service: notify.cytech_alert_support
        data:
          title: "Cytech SD card alert: {{ unit }}"
          message: "{{ unit }}: SD card problem: {{ msg }}"
      # v41: the owner copy is AUTOMATIC -- sent only when the owner has
      # registered an address (sensor.cytech_owner_email non-empty. The old
      # Cytech/Me/Both destination switch is gone: support@cytech.biz always
      # gets every alert, and the owner is included only if they registered.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.cytech_owner_email') not in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - service: notify.cytech_alert_email
                data:
                  title: "Cytech SD card alert: {{ unit }}"
                  message: "{{ unit }}: SD card problem: {{ msg }}"

  - id: cytech_alert_canary_failed
    alias: "Cytech: SD canary alert"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_sd_canary
        to: "FAIL"
    action:
      - service: persistent_notification.create
        data:
          notification_id: cytech_canary_alert
          title: "SD card write test failed"
          message: "{{ state_attr('sensor.cytech_sd_canary', 'message') | default('see sensor') }}"
      - variables:
          unit: "{{ states('sensor.cytech_device_id') }}"
          msg: "{{ state_attr('sensor.cytech_sd_canary', 'message') | default('see sensor') }}"
      - service: notify.cytech_alert_support
        data:
          title: "Cytech SD canary alert: {{ unit }}"
          message: "{{ unit }}: SD canary failed: {{ msg }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.cytech_owner_email') not in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - service: notify.cytech_alert_email
                data:
                  title: "Cytech SD canary alert: {{ unit }}"
                  message: "{{ unit }}: SD canary failed: {{ msg }}"

  - id: cytech_alert_boot_storm
    alias: "Cytech: Repeated restarts alert"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.cytech_warning
        to: "REPEATED_RESTARTS"
    action:
      - service: persistent_notification.create
        data:
          notification_id: cytech_boot_alert
          title: "Repeated restarts detected"
          message: "{{ state_attr('sensor.cytech_warning', 'message') | default('see sensor') }}"
      - variables:
          unit: "{{ states('sensor.cytech_device_id') }}"
          msg: "{{ state_attr('sensor.cytech_warning', 'message') | default('see sensor') }}"
      - service: notify.cytech_alert_support
        data:
          title: "Cytech repeated restarts alert: {{ unit }}"
          message: "{{ unit }}: Repeated restarts detected: {{ msg }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.cytech_owner_email') not in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - service: notify.cytech_alert_email
                data:
                  title: "Cytech repeated restarts alert: {{ unit }}"
                  message: "{{ unit }}: Repeated restarts detected: {{ msg }}"

# v34: MQTT sensor backing the System Status card in dashboards/alarm.yaml.
# Reads the raw panel status word from cytech_comfort_mqtt/alarm (the same
# topic the alarm_control_panel uses) so a Trouble state is visible in HA --
# the alarm panel entity maps Idle/Trouble/Alert to "disarmed" and therefore
# cannot show a trouble condition on its own.
mqtt:
  sensor:
    - name: Comfort System Status
      unique_id: comfort_system_status
      state_topic: "cytech_comfort_mqtt/alarm"
      availability_topic: "cytech_comfort_mqtt/alarm/online"
      payload_available: "1"
      payload_not_available: "0"

# v36: the two smtp notify platforms live in a device-local generated
# package packages/cytech_email.yaml with LITERAL values written from
# /config/.cytech_secrets by ensure_email_secrets() -- never in this repo.
# No creds -> no file -> nothing references a missing !secret, so the
# config always parses (v35's raw !secret refs here put every device
# without SMTP creds into recovery mode: the config failed to parse, the
# maintenance pass that would have written the secrets could not run, and
# the device was stuck until the creds were pushed by hand).
